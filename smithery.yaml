name: debuggingai
description: >
  Universal debugger control for any AI agent — Claude, Cline, Cursor, and more.
  Exposes VS Code's full debugger (breakpoints, stepping, variable inspection) as
  MCP tools so any MCP-capable AI client can drive a live debug session without
  knowing the underlying HTTP API.
license: MIT
repository: https://github.com/mickeyperlstein/DebuggingAI

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      port:
        type: number
        default: 7890
        description: >
          Port where the DebuggingAI VS Code extension HTTP server is listening.
          Must match the debuggingAI.serverPort setting in VS Code (default 7890).
      host:
        type: string
        default: "127.0.0.1"
        description: Host where the DebuggingAI VS Code extension HTTP server is listening.
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "--package=debugging-ai", "debugging-ai-mcp"],
      env: {
        DEBUGAI_PORT: String(config.port ?? 7890),
        DEBUGAI_HOST: config.host ?? "127.0.0.1"
      }
    })
